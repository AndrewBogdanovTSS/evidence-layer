name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm install
      - run: npm test
      - run: npm run lint
      # The review the change's author wrote, held to its own artifact blocks -
      # findings become annotations on its lines. A change with no review.md is
      # `misconfigured`, not a pass. It runs the evidence-layer installed above,
      # so this job and a laptop give the same verdict.
      - uses: AndrewBogdanovTSS/evidence-layer@v0.15.0
        with:
          claims: review.md
          governance: 'true'
