name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Built once, here, and nowhere else.
  #
  # The first version of this file ran `pnpm build` on every leg of the test
  # matrix, which failed on the oldest Node then supported - not because the
  # package needs a newer Node, but because tsdown does (`^22.18.0 || ^24.11.0
  # || >=26.0.0`). Those are different claims. What `engines.node` promises is
  # that the *published* ESM runs on the oldest Node it names, and rebuilding
  # it on every leg never checked that; it checked the toolchain instead. So: build once, hand the built
  # artifact to every version, and let the matrix test the thing consumers
  # actually install.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # The floor `engines.node` names, met the way a consumer meets it: plain
  # `node`, no installer, no test runner, no dependencies.
  #
  # `22.0.0` is pinned rather than `22`, because `>=22` is a claim about the
  # oldest 22 and testing only the newest would leave it unchecked. Node 20 is
  # absent on purpose: it reached end of life on 2026-04-30, and a matrix leg
  # for an unpatched runtime tests nothing anyone should be running.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', '22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # setup-node v5 enables package-manager caching automatically when
          # package.json has a top-level `packageManager` field, and then
          # cannot find the pnpm this job deliberately never installs. Turning
          # it off is what keeps the job honest: nothing but node runs here.
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # No `pnpm install` on purpose. If this passes, the package genuinely
      # has no runtime dependencies - which is otherwise a README sentence
      # nobody checked.
      - run: node scripts/smoke.mjs

  # The full suite. `22.0.0` is absent here and present in `smoke` above: the
  # toolchain (pnpm, vitest) has its own, newer floor, and conflating the two
  # is how a claim about the package quietly becomes a claim about its
  # development environment.
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # `test:unit` rather than `test`, which would rebuild - the point of this
      # job is to run the suite, `test/bin.test.ts` included, against the
      # artifact the build job produced.
      - run: pnpm test:unit

  # The action the way most projects meet it: nothing installed, so it runs
  # `npx evidence-layer@<version>` from the registry. Every other run of the
  # action here (`uses: ./` below, and test/action.test.ts) finds this
  # checkout's build or a stand-in npx; only this one fetches a real package.
  # The version is the one npm has now, not package.json's - on a release
  # commit, package.json names a version that is still being published.
  action-from-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: action
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: A project with nothing installed
        id: project
        run: |
          cp action/examples/plain-node-project/reviews/good-claims.md review.md
          cp action/examples/plain-node-project/reviews/bad-claims.md bad.md
          echo "version=$(npm view evidence-layer version)" >> "$GITHUB_OUTPUT"
      - name: The action, on a review whose claims hold
        id: good
        uses: ./action
        with:
          claims: review.md
          version: ${{ steps.project.outputs.version }}
      - name: The action, on a review whose claims do not
        id: bad
        continue-on-error: true
        uses: ./action
        with:
          claims: bad.md
          version: ${{ steps.project.outputs.version }}
      - name: The outputs say what the checks found
        env:
          GOOD: ${{ steps.good.outputs.conclusion }}
          BAD: ${{ steps.bad.outputs.conclusion }}
          BAD_EXIT: ${{ steps.bad.outputs.exit-code }}
        run: |
          echo "good=$GOOD bad=$BAD bad exit-code=$BAD_EXIT"
          test "$GOOD" = success && test "$BAD" = failure && test "$BAD_EXIT" = 1

  # The example project's workflow cannot run from inside this repository -
  # GitHub reads workflows only at the top level - so its handoff runs here, on
  # a standalone copy made from this commit's build: gather on one runner, the
  # bundle carried as an artifact, the review held to it on another. The review
  # is the bundle's own suggested claims, which is what the example's model is
  # asked to copy - no model runs here, and the handoff is what is tested.
  example-evidence:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Gather in a standalone copy, failing as its CI would
        run: |
          node examples/plain-node-project/scripts/standalone.mjs "$RUNNER_TEMP/widget-counter"
          cd "$RUNNER_TEMP/widget-counter"
          npm run evidence -- --base HEAD
          awk '/^## Suggested claims$/ { on = 1; next } /^## / { on = 0 } on' evidence.local.md > review.md
          cp evidence.local.md review.md "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: example-evidence
          path: |
            evidence.local.md
            review.md
          if-no-files-found: error
          retention-days: 1

  example-review:
    needs: example-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: example-evidence
          path: example/
      - name: The review, held to the bundle another job gathered
        uses: ./
        with:
          claims: example/review.md
          bundle: example/evidence.local.md

  # Separate job, one Node version: these check the repository, not the code's
  # behaviour on a given runtime, so running them three times says nothing new.
  governance:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `recordNewMisses` reads commit trailers; a shallow clone would
          # silently find none and report a clean history that was never read.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: pnpm check:docs

      # Every commit the push or pull request brings, not only the tip: a
      # trailer that names no symbol, or a function copied under new names, is
      # a fact about one commit, and a later commit cannot fix it. Merges are
      # left out - their diff is the branches', not anyone's decision. When
      # there is no previous commit to start from (a new branch, a force push)
      # the tip is checked alone, which is less, and the log says which.
      - name: check:ladder, on every new commit
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            echo "no previous commit to start from - checking $AFTER alone"
            range="$AFTER^!"
          fi
          status=0
          for commit in $(git rev-list --no-merges --reverse "$range"); do
            pnpm check:ladder "$commit" || status=1
          done
          exit $status

      # The action, run on this repository the way a project runs it. `uses: ./`
      # resolves to this checkout's build (downloaded above), so what is tested
      # is this commit's action and this commit's checks together.
      - name: The GitHub Action, on a fixture review
        uses: ./
        with:
          claims: examples/plain-node-project/reviews/good-claims.md

      # Captured rather than streamed, because the summary is rendered from the
      # machine-readable block the run emits - and it is rendered whether the
      # checks passed or not, since "no report" is the one outcome a reader
      # must never confuse with a clean run.
      - name: check:all
        id: checks
        run: pnpm check:all --enforce | tee governance-output.txt
        continue-on-error: true

      - name: Summary
        if: always()
        run: pnpm ci:summary governance-output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the checks failed
        if: steps.checks.outcome == 'failure'
        run: exit 1
