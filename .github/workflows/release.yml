name: release

on:
  push:
    tags: ['v*']

# `id-token: write` is what lets npm attach a provenance attestation: a signed,
# public record of which commit and which workflow run produced the tarball.
# It is also the only publishing credential. npm trusts this workflow file in
# this repository (a Trusted Publisher), so the publish exchanges the run's
# OIDC token for a short-lived one; there is no long-lived npm token to leak,
# rotate or forget to renew.
# The alternative is a README sentence asserting that the published package was
# built from this source, which is exactly the kind of unbacked claim this
# package exists to make impossible.
#
# `contents: write` is for the GitHub Release at the end. A tag is a git ref and
# a Release is a separate object, so a tag alone leaves the repository silent
# about a version that is already installable - the registry asserts it exists
# and the source of truth says nothing either way.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm smoke
      - run: pnpm check:docs

      # The tag is a claim about the version being published. Checked here
      # rather than discovered by whoever installs the wrong one.
      - name: The tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $packaged"
            exit 1
          fi

      # No token: pnpm exchanges the OIDC token (see `permissions` above). If
      # the Trusted Publisher on npmjs.com is missing or names another workflow,
      # this step fails - and that is the point; there is no fallback to fail
      # over to.
      - run: pnpm publish --no-git-checks --provenance --access public

      # After the publish, never before. A Release created first would announce
      # a version the registry might then refuse, and the announcement is the
      # part people read.
      #
      # `--verify-tag` refuses to invent a release for a tag that is not on the
      # remote; `--generate-notes` writes the notes from the commits since the
      # previous tag, so the changelog is the history rather than a second
      # account of it, written later, by someone who was not looking. A
      # version that changes what users must do can carry its own notes in
      # `docs/releases/<tag>.md`, committed with the release and reviewed with
      # it; they go first, and the commit history still follows them.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$notes" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
